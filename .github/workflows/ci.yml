name: Test plugin

# This repo is a TEMPLATE / plugin marketplace — it has no application code.
# This workflow tests the agentic-sdd plugin itself: hook/tool behavior, consistency of the
# docs with the files on disk, manifests + frontmatter, shell quality, example pipelines,
# and the copy installer.
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test agentic-sdd plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck jq
          python3 -m pip install --quiet pyyaml

      - name: JSON manifests parse
        run: |
          set -e
          for f in .claude-plugin/marketplace.json \
                   plugins/agentic-sdd/.claude-plugin/plugin.json \
                   plugins/agentic-sdd/hooks/hooks.json \
                   plugins/agentic-sdd/settings.template.json \
                   plugins/agentic-sdd/tools/stacks.json; do
            python3 -c "import json,sys; json.load(open('$f'))" && echo "ok  $f"
          done

      - name: YAML workflows parse
        run: |
          python3 - <<'PY'
          import glob, yaml
          for f in (glob.glob('.github/workflows/*.yml') + glob.glob('templates/*.yml')
                    + glob.glob('plugins/agentic-sdd/skills/*/references/examples/*.yml')):
              yaml.safe_load(open(f)); print('ok ', f)
          PY

      - name: Consistency (loop line, counts, versions, stack registry, frontmatter)
        run: bash scripts/check-consistency.sh

      - name: shellcheck (strict)
        run: shellcheck -x -S warning -P plugins/agentic-sdd/hooks/scripts plugins/agentic-sdd/hooks/scripts/*.sh scripts/*.sh tests/*.sh

      - name: Python tools compile
        run: python3 -m py_compile plugins/agentic-sdd/tools/*.py plugins/agentic-sdd/hooks/scripts/*.py

      - name: Hook, tool and installer behavior
        run: bash tests/run.sh

      - name: actionlint example + template pipelines
        run: |
          shopt -s nullglob
          files=(plugins/agentic-sdd/skills/*/references/examples/*.yml templates/*.yml .github/workflows/*.yml)
          docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color "${files[@]}"
